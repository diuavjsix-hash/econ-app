<!doctype html><html lang="ko"><meta charset="utf-8"><title>접점 통과 직선 검증</title>
<style>@import url('/src/ui/tokens.css');@import url('/src/ui/components.css');@import url('/src/graph/snap-feedback.css');@import url('/src/styles.css');body{overflow:auto;padding:16px}#stage{width:800px;height:540px;position:relative}pre{white-space:pre-wrap}</style>
<button id="run">검증</button><pre id="result">준비</pre><div id="stage"></div>
<script type="module">
import { mountGraph } from '/src/graph/canvas.js';
import { createViewport,toScreen,toWorld } from '/src/graph/viewport.js';
import { snapMovingCurve } from '/src/graph/point-magnets.js';
import { contactTangentSlope } from '/src/graph/curve-contacts.js';
import { serializeDocument } from '/src/export.js';
import { CURVE_CONTACT_CASES } from '/tests/fixtures/curve-contact-cases.js';
import { createStore } from '/src/state.js';
import { curveFamilyOf } from '/src/models/curve-families.js';
const stage=document.querySelector('#stage'),out=document.querySelector('#result');let store,svg,dispose;
const near=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<1e-7;
const sameSlope=(a,b)=>a===null||b===null?a===b:Math.abs(Math.atan(a)-Math.atan(b))<1e-6;
const view=()=>createViewport(stage.clientWidth,stage.clientHeight,store.getState().quadrantMode,store.getState());
function send(type,p,flags={},target=svg){const v=view(),s=toScreen(p,v),r=svg.getBoundingClientRect();target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:95,pointerType:'mouse',button:0,buttons:type==='pointerup'?0:1,clientX:r.left+s.x*r.width/v.width,clientY:r.top+s.y*r.height/v.height,...flags}));}
const click=p=>{send('pointerdown',p);send('pointerup',p)};
function mount(){dispose?.();dispose=mountGraph(stage,store);svg=stage.querySelector('svg');svg.setPointerCapture=()=>{};svg.hasPointerCapture=()=>false;svg.releasePointerCapture=()=>{};}
// A world point `along` px down the tangent from the contact and `across` px off it.
function pointerAt(p,slope,along,across){const u=view().unit,n=slope===null?1:Math.hypot(1,slope),d=slope===null?{x:0,y:1}:{x:1/n,y:slope/n};return{x:p.x+(d.x*along-d.y*across)/u,y:p.y+(d.y*along+d.x*across)/u};}
const feedback=()=>svg.querySelector('.snap-feedback[data-snap-kind="tangent"]');
const fixtures=CURVE_CONTACT_CASES.filter(c=>['free oblique interior','free vertical interior','opposite cobb-douglas and cobb-douglas'].includes(c.name));
document.querySelector('#run').onclick=async()=>{const passed=[];const check=(ok,name)=>{if(!ok)throw Error(name);passed.push(name)};try{
 for(const size of [800,312])for(const flipX of [false,true])for(const flipY of [false,true])for(const fixture of fixtures){
  stage.style.width=size+'px';const setup=fixture.setup();store=setup.store;store.updateDiagram({flipX,flipY});mount();
  const name=`${size} ${flipX}/${flipY} ${fixture.name}`,state=store.getState(),moving=[...state.curves,...state.sketches].find(c=>c.id===setup.moving);
  const contact=snapMovingCurve(moving,state,view().bounds,view().unit,{axis:fixture.axis});
  store.selectObject(setup.moving);store.updateSelected({anchor:contact.anchor,translate:true});
  const found=contactTangentSlope(store.getState(),view().bounds,contact.point);check(found,`${name}: contact reports its shared tangent`);
  // Existing flow: point magnet on the contact, then the through-point line.
  store.setToolMode('point');const off=pointerAt(contact.point,found.slope,4,5);send('pointermove',off);
  check(feedback()?.querySelector('.snap-feedback-label')?.textContent.includes('접점 맞춤'),`${name}: point hover shows the contact`);
  click(off);const point=store.getState().points.at(-1);check(near(point.anchor,contact.point),`${name}: point stores the exact contact`);
  const lineId=store.lineThroughSelectedPoint({slope:contactTangentSlope(store.getState(),view().bounds,point.anchor).slope});
  let line=store.getState().lines.find(l=>l.id===lineId);
  check(sameSlope(line.slope,found.slope)&&near(line.anchor,contact.point)&&line.binding?.sourceId===point.id,`${name}: new line starts on the common tangent and follows the point`);
  // Rotate it away, then drag the rotation handle back onto the tangent.
  store.updateSelected({slope:found.slope===null?1:found.slope===0?-3:-1/found.slope});const before=JSON.stringify(serializeDocument(store.getState()));
  const handle=svg.querySelector(`[data-id="${lineId}"][data-action="rotate"]`);
  send('pointerdown',toWorld({x:Number(handle.getAttribute('cx')),y:Number(handle.getAttribute('cy'))},view()),{},handle);
  send('pointermove',pointerAt(contact.point,found.slope,90,40));check(!feedback(),`${name}: far rotation is free`);
  send('pointermove',pointerAt(contact.point,found.slope,90,12));line=store.getState().lines.find(l=>l.id===lineId);
  check(sameSlope(line.slope,found.slope)&&near(line.anchor,contact.point),`${name}: 16px rotation captures the tangent and keeps the contact`);
  check(feedback()?.querySelector('.snap-feedback-label')?.textContent.includes('접선 맞춤')&&getComputedStyle(feedback()).pointerEvents==='none',`${name}: rotation uses common tangent feedback`);
  check(new Set([...svg.querySelectorAll('[data-snap-source]')].map(n=>n.dataset.snapSource)).size===2,`${name}: both touching curves are highlighted`);
  send('pointermove',pointerAt(contact.point,found.slope,90,20));check(sameSlope(store.getState().lines.find(l=>l.id===lineId).slope,found.slope),`${name}: held inside 24px`);
  send('pointermove',pointerAt(contact.point,found.slope,90,8),{altKey:true});
  check(!feedback()&&!sameSlope(store.getState().lines.find(l=>l.id===lineId).slope,found.slope),`${name}: Alt bypasses the tangent magnet`);
  const end=pointerAt(contact.point,found.slope,90,6);send('pointermove',end);send('pointerup',end);
  check(sameSlope(store.getState().lines.find(l=>l.id===lineId).slope,found.slope)&&!feedback(),`${name}: release stores the tangent slope and clears feedback`);
  store.undo();check(JSON.stringify(serializeDocument(store.getState()))===before,`${name}: one undo restores the rotation`);
  store.redo();
  // The contact is still a shared target for other tools after the gesture.
  store.setToolMode('line');store.update({lineKind:'segment',lineStyle:'dashed'});click(pointerAt(contact.point,found.slope,-3,4));
  const far=pointerAt(contact.point,found.slope,-120,-60);send('pointermove',far);click(far);
  check(near(store.getState().lines.at(-1)?.anchor??{x:NaN,y:NaN},contact.point),`${name}: segment start still snaps to the contact`);
  // Shift locks the nearest of horizontal, vertical and the contact's common tangent.
  const count=store.getState().lines.length,toward=pointerAt(contact.point,found.slope,60,5);
  store.setToolMode('line');click(pointerAt(contact.point,found.slope,-3,4));send('pointermove',toward,{shiftKey:true});
  check(feedback()?.querySelector('.snap-feedback-label')?.textContent.includes('접선 맞춤'),`${name}: Shift toward the tangent shows the tangent lock`);
  check(new Set([...svg.querySelectorAll('[data-snap-source]')].map(n=>n.dataset.snapSource)).size===2,`${name}: the Shift lock highlights both touching curves`);
  send('pointerdown',toward,{shiftKey:true});send('pointerup',toward,{shiftKey:true});
  const shifted=store.getState().lines.at(-1);
  check(store.getState().lines.length===count+1&&sameSlope(shifted.slope,found.slope)&&near(shifted.anchor,contact.point),`${name}: Shift click draws the common tangent through the contact`);
  store.undo();check(store.getState().lines.length===count,`${name}: the Shift line is one undo step`);
  store.setToolMode('line');click(pointerAt(contact.point,found.slope,-3,4));send('pointermove',toward,{shiftKey:true,altKey:true});
  check(!feedback(),`${name}: Alt+Shift drops the tangent lock`);
  send('pointerdown',toward,{shiftKey:true,altKey:true});send('pointerup',toward,{shiftKey:true,altKey:true});
  const axisLine=store.getState().lines.at(-1);
  check(store.getState().lines.length===count+1&&(axisLine.slope===0||axisLine.slope===null),`${name}: Alt+Shift keeps the plain axis lock`);
  store.undo();
 }
 // A start on a single PPC: Shift locks its tangent there.
 for(const size of [800,312]){
  stage.style.width=size+'px';store=createStore();const id=store.addIndifference('ppc',{anchor:{x:3,y:3}});mount();
  const ppc=store.getState().curves.find(c=>c.id===id),family=curveFamilyOf(ppc),bounds=view().bounds;
  const on=family.nearestPoint(ppc,{x:2,y:4},bounds),t=family.tangentVector(ppc,on),slope=t.y/t.x,name=`${size} single PPC`;
  store.setToolMode('line');store.update({lineKind:'segment',lineStyle:'solid'});
  click(pointerAt(on,slope,0,3));const toward=pointerAt(on,slope,40,3);send('pointermove',toward,{shiftKey:true});
  check(feedback()?.querySelector('.snap-feedback-label')?.textContent.includes('접선 맞춤'),`${name}: Shift shows the tangent lock from a point on the curve`);
  send('pointerdown',toward,{shiftKey:true});send('pointerup',toward,{shiftKey:true});
  const line=store.getState().lines.at(-1),touch=family.nearestPoint(ppc,line.anchor,bounds),local=family.tangentVector(ppc,line.anchor);
  check(Math.hypot(touch.x-line.anchor.x,touch.y-line.anchor.y)<1e-7&&sameSlope(line.slope,local.y/local.x),`${name}: the line is tangent to the PPC at its start`);
  store.setToolMode('line');click(pointerAt(on,slope,0,3));const flat={x:on.x+120/view().unit,y:on.y+0.05};
  send('pointerdown',flat,{shiftKey:true});send('pointerup',flat,{shiftKey:true});
  check(store.getState().lines.at(-1).slope===0,`${name}: a heading near horizontal still locks horizontal`);
  const label=()=>svg.querySelector('.snap-feedback .snap-feedback-label')?.textContent??'';
  store.undo();store.undo();check(!store.getState().lines.length,`${name}: the drawn lines are undone before the axis checks`);
  store.setToolMode('line');click(pointerAt(on,slope,0,3));send('pointermove',flat,{shiftKey:true});
  check(label().includes('수평 맞춤')&&svg.querySelector('.snap-feedback[data-snap-kind="direction"]')&&!svg.querySelector('[data-snap-source]'),`${name}: the Shift axis lock shows 수평 맞춤 without a highlighted shape`);
  const up={x:on.x+0.05,y:on.y+120/view().unit};send('pointermove',up,{shiftKey:true});
  check(label().includes('수직 맞춤'),`${name}: and 수직 맞춤 when the heading is vertical`);
  send('pointermove',flat);check(!label().includes('맞춤'),`${name}: releasing Shift clears the lock feedback`);
  store.setToolMode('hand');
  // A placed point within reach wins over the curve body under the pointer, for every point consumer.
  const placed={x:on.x+6/view().unit,y:on.y+6/view().unit};store.addPoint(placed);
  for(const mode of ['sketch','line','point']){
   store.setToolMode(mode);send('pointermove',on);
   check(label().includes('점 맞춤'),`${name}: ${mode} hover on the curve prefers the nearby point`);
  }
  store.setToolMode('sketch');click(on);click({x:on.x+2.5,y:on.y+2.5});click({x:on.x+1.4,y:on.y+0.7});
  const sketch=store.getState().sketches.at(-1);
  check(sketch&&near(sketch.start,placed),`${name}: the free curve starts exactly on the placed point`);
 }
 dispose?.();out.textContent=JSON.stringify({ok:true,count:passed.length,passed},null,2);
}catch(error){out.textContent=JSON.stringify({ok:false,passed,error:error.message,stack:error.stack},null,2)}};
</script></html>
